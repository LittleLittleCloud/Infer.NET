interface:
  display_name: "Infer.NET Dual-Host Development"
  short_description: "GitHub code sync, SSH development and deployment, and Issue/Pages evidence"
  default_prompt: "Use $infer-net-dual-host to continue Infer.NET dual-host development: commit changes on a feature branch and create a PR; do not push directly to main unless the user explicitly requests it. Synchronize code through GitHub, track tasks in Issues, and update progress and experiment records on Pages. Follow the deployment SOP to prepare, update, or roll back services, and verify fixed targets over SSH. Write project documentation, reports, comments, commits, Issues, PRs, and site content in English."
