name: build-and-test
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-26
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Pi HumanEval harness (offline, no model)
        run: python3 scripts/test-pi-humaneval.py
      - name: Verify selected SDK
        shell: bash
        run: |
          dotnet --info
          python3 - <<'PY'
          import json, subprocess
          expected = json.load(open('global.json'))['sdk']['version']
          actual = subprocess.check_output(['dotnet', '--version'], text=True).strip()
          if actual != expected:
              raise SystemExit(f'Expected SDK {expected}, selected {actual}')
          PY
      - name: Verify Metal SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk_version"
          test "${sdk_version%%.*}" -ge 26
      - run: dotnet restore DeepInfer.slnx --locked-mode
      - run: dotnet build DeepInfer.slnx -c Release --no-restore
      - name: Record actual GPU capabilities
        run: dotnet run --project src/DeepInfer.Host -c Release --no-build -- devices
      - run: dotnet test tests/DeepInfer.Tests -c Release --no-build
      - run: python3 scripts/chat-integration.py
      - run: python3 scripts/integration.py
      - run: dotnet publish src/DeepInfer.Host -c Release -r ${{ matrix.rid }} -o artifacts/native
      - if: runner.os != 'Windows'
        run: python3 scripts/integration.py --executable artifacts/native/deepinfer
      - if: runner.os == 'Windows'
        run: python scripts/integration.py --executable artifacts/native/deepinfer.exe
      - if: runner.os != 'Windows'
        run: python3 scripts/chat-integration.py --executable artifacts/native/deepinfer
      - if: runner.os == 'Windows'
        run: python scripts/chat-integration.py --executable artifacts/native/deepinfer.exe
